# Invite links (/join/<token>, /api/invites/<token>, /api/ws/invite/<token>) are a candidate's
# private key to their interview, so the access log shows the token as *** (N22).
map $request_uri $safe_request_uri {
    "~^(?<before>.*/(?:invites?|join)/)[^/?]+(?<after>.*)$"  "${before}***${after}";
    default  $request_uri;
}
log_format safe '$remote_addr - [$time_local] "$request_method $safe_request_uri $server_protocol" $status $body_bytes_sent';


server {
    listen 80;
    access_log /var/log/nginx/access.log safe;
    client_max_body_size 130m;  # 25 CVs x 5 MB each, plus a little room (Module 5 limits)

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    # Live speech to text (Module 8): WebSockets need the "Upgrade" handshake passed on to the API,
    # and they stay open for the whole interview, so the time limits are one hour.
    location /api/ws/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}